[project]
name = "form-filling-env"
version = "1.0.0"
description = "OpenEnv environment for training AI agents to fill real-world forms from messy text."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.29.0",
    "pydantic==2.7.1",
    "openai==1.30.1",
    "pyyaml==6.0.1",
    "openenv>=0.1.0",
]

[project.scripts]
server = "server.app:main"

[project.urls]
Homepage = "https://huggingface.co/spaces/khushiagarwal12/form-filling-env"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"
